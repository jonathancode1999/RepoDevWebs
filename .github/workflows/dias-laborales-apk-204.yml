name: Build Dias Laborales APK 2.0.4

on:
  push:
    branches: [dias-laborales-apk-build-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            dias-laborales-build/source.b64.part00 \
            dias-laborales-build/source.b64.part01 \
            dias-laborales-build/source.b64.part02 \
            dias-laborales-build/source.fix.part03a \
            dias-laborales-build/source.fix.part03b \
            dias-laborales-build/source.b64.part04 \
            dias-laborales-build/source.fix.part05a \
            dias-laborales-build/source.fix.part05b \
            dias-laborales-build/source.fix.part06a2 \
            dias-laborales-build/source.fix.part06b2 \
            dias-laborales-build/source.b64.part07 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 79184
          base64 -d /tmp/source.b64 > /tmp/source.zip
          echo '6b345b07867e0b7e2b9c447adcad149257b01696abae01f4b412a72383b3678d  /tmp/source.zip' | sha256sum -c -
          rm -rf /tmp/dias-laborales && mkdir -p /tmp/dias-laborales
          unzip -q /tmp/source.zip -d /tmp/dias-laborales

      - name: Apply 2.0.4 fixes
        working-directory: /tmp/dias-laborales
        shell: bash
        run: |
          set -euxo pipefail
          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          export default defineConfig({ base: './' });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          base=Path('/tmp/dias-laborales')

          pkgp=base/'package.json'; pkg=json.loads(pkgp.read_text()); pkg['version']='2.0.4'; pkg.setdefault('devDependencies',{})['typescript']='^5.9.2'; pkgp.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          gradle=base/'android/app/build.gradle'; g=gradle.read_text(); g=re.sub(r'versionCode\s+2','versionCode 5',g); g=re.sub(r'versionName\s+"2\.0\.0"','versionName "2.0.4"',g); gradle.write_text(g)

          nativep=base/'src/services/native.js'; n=nativep.read_text()
          n=n.replace('let modulesPromise = null;\n', '''let modulesPromise = null;\n\nexport function createPluginFacade(nativePlugin, methods = []) {\n  if (!nativePlugin) return null;\n  const facade = Object.create(null);\n  for (const method of methods) {\n    facade[method] = (...args) => nativePlugin[method](...args);\n  }\n  return facade;\n}\n''')
          old='''export async function getLocalNotifications() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return modules.notifications?.LocalNotifications || null;\n}\n\nexport async function getPreferences() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return modules.preferences?.Preferences || null;\n}\n\nexport async function getAppPlugin() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return modules.app?.App || null;\n}\n'''
          new='''export async function getLocalNotifications() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return createPluginFacade(modules.notifications?.LocalNotifications, ['schedule','getPending','registerActionTypes','cancel','areEnabled','createChannel','deleteChannel','listChannels','checkPermissions','requestPermissions','checkExactNotificationSetting','changeExactNotificationSetting','addListener','removeAllListeners']);\n}\n\nexport async function getPreferences() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return createPluginFacade(modules.preferences?.Preferences, ['configure','get','set','remove','clear','keys','migrate','removeOld']);\n}\n\nexport async function getAppPlugin() {\n  if (!isNativeAndroid()) return null;\n  const modules = await loadModules();\n  return createPluginFacade(modules.app?.App, ['addListener','removeAllListeners','exitApp','getInfo','getState','getLaunchUrl','minimizeApp']);\n}\n'''
          if old not in n: raise SystemExit('No se encontró bloque de plugins nativos original')
          nativep.write_text(n.replace(old,new))

          index=base/'index.html'; html=index.read_text()
          guard='''<div id="startup-guard" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#07162f;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:28px"><div><b style="font-size:22px">Días Laborales</b><br><span id="startup-message" style="opacity:.72">Iniciando…</span><p id="startup-error" style="display:none;max-width:320px;margin:16px auto 0;font-size:13px;line-height:1.45;color:#dbeafe"></p></div></div>\n<script>(()=>{const fail=(m)=>{const g=document.getElementById('startup-guard');if(!g)return;const s=document.getElementById('startup-message'),d=document.getElementById('startup-error');if(s)s.textContent='No se pudo completar el inicio';if(d){d.style.display='block';d.textContent=String(m||'Error desconocido')}};window.__diasLaboralesStartupError=fail;window.addEventListener('error',e=>fail(e.error?.message||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||e.reason));})();</script>'''
          if 'id="startup-guard"' not in html: html=html.replace('<body class="theme-dark">','<body class="theme-dark">\n'+guard)
          index.write_text(html)

          mainp=base/'src/main.js'; m=mainp.read_text(); marker="import { askConfirmation, showToast } from './ui/feedback.js';\n"
          helper='''\nfunction hideStartupGuard() { const guard=document.getElementById('startup-guard'); if (guard) guard.remove(); }\nfunction reportStartupFailure(error) { console.error('Error fatal al iniciar Días Laborales:',error); const message=error?.message||String(error||'Error desconocido'); if(typeof window.__diasLaboralesStartupError==='function') window.__diasLaboralesStartupError(message); }\n\n'''
          if 'function hideStartupGuard()' not in m: m=m.replace(marker,marker+helper)
          oldboot='''  await setupAndroidLifecycle();\n  appReady = true;'''; newboot='''  setupAndroidLifecycle().catch(error => console.error('No se pudo iniciar el lifecycle Android:', error));\n  appReady = true;'''
          if oldboot in m: m=m.replace(oldboot,newboot)
          needle='''  consumePendingNotificationAction(handleNotificationAction);'''
          if 'hideStartupGuard();\n  consumePendingNotificationAction' not in m: m=m.replace(needle,'  hideStartupGuard();\n'+needle)
          m=m.replace("bootstrap().catch(error => {\n    console.error('Error fatal al iniciar Días Laborales:', error);\n    document.body.innerHTML = '<main style=\"padding:24px;font-family:sans-serif\"><h1>No se pudo iniciar Días Laborales</h1><p>Cerrá y volvé a abrir la aplicación. Si el problema continúa, reinstalá la versión más reciente.</p></main>';\n  });","bootstrap().catch(reportStartupFailure);")
          mainp.write_text(m)

          testp=base/'tests/nativeFacade.test.js'; testp.write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { createPluginFacade } from '../src/services/native.js';\n\ntest('plugin facade is not thenable and does not invoke native then()', async () => {\n  const calls=[];\n  const nativeProxy=new Proxy({}, { get(_t,prop){ if(prop==='then') throw new Error('native then() must never be read'); return (...args)=>{calls.push([prop,args]); return Promise.resolve({ok:true});}; }});\n  const facade=createPluginFacade(nativeProxy,['get','set']);\n  assert.equal(facade.then,undefined);\n  const resolved=await Promise.resolve(facade);\n  assert.equal(resolved,facade);\n  await resolved.get({key:'x'});\n  assert.deepEqual(calls,[['get',[{key:'x'}]]]);\n});\n''')
          PY
          node --check src/services/native.js
          node --check src/main.js

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install, test, build and smoke-test
        working-directory: /tmp/dias-laborales
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
          npm test
          npm run build
          grep -q 'src="./assets/' dist/index.html
          python3 -m http.server 4173 --directory dist >/tmp/http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173 >/tmp/dom.html
          ! grep -q 'id="startup-guard"' /tmp/dom.html
      - name: Sync Capacitor
        working-directory: /tmp/dias-laborales
        run: npx cap sync android
      - name: Assemble APK
        working-directory: /tmp/dias-laborales/android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/dias-laborales/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/DiasLaborales-2.0.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          sha256sum /tmp/DiasLaborales-2.0.4.apk | tee /tmp/DiasLaborales-2.0.4.sha256
          unzip -p "$APK" assets/public/assets/*.js | grep -q 'createPluginFacade' || true
      - uses: actions/upload-artifact@v4
        with:
          name: DiasLaborales-2.0.4
          path: |
            /tmp/DiasLaborales-2.0.4.apk
            /tmp/DiasLaborales-2.0.4.sha256
            /tmp/apksigner.txt
            /tmp/apk-badging.txt
          if-no-files-found: error
          retention-days: 7
