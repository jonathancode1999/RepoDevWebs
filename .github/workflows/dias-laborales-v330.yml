name: Build Dias Laborales 3.3.0

on:
  push:
    branches: [dias-laborales-v330-final-20260817]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct 3.3.0 source
        shell: bash
        run: |
          set -euxo pipefail
          cat dias-laborales-v3/source.part00 dias-laborales-v3/source.part01 dias-laborales-v3/source.part02a dias-laborales-v3/source.part02b dias-laborales-v3/source.part03 dias-laborales-v3/source.part04 dias-laborales-v3/source.part05 dias-laborales-v3/source.part06 dias-laborales-v3/source.part07 dias-laborales-v3/source.part08 dias-laborales-v3/source.part09 > /tmp/pre.b64
          base64 -d /tmp/pre.b64 > /tmp/pre.bin
          cat dias-laborales-v3/c10b0.bin dias-laborales-v3/c10b1.bin dias-laborales-v3/c10b2.bin dias-laborales-v3/c10b3.bin dias-laborales-v3/c10b4.bin dias-laborales-v3/c10b5.bin dias-laborales-v3/c10b6.bin > /tmp/c10.bin
          base64 -d dias-laborales-v3/source.part11 > /tmp/post.bin
          cat /tmp/pre.bin /tmp/c10.bin /tmp/post.bin > /tmp/DiasLaborales_v3.tar.xz
          echo '1bef0afa3277f83b8fddedf5bf608d2455e55428cd32654159424039301dc57d  /tmp/DiasLaborales_v3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/dias-laborales
          tar -xJf /tmp/DiasLaborales_v3.tar.xz -C /tmp/dias-laborales
          cd /tmp/dias-laborales
          patch -p2 < "$GITHUB_WORKSPACE/dias-laborales-v3/v301-safe-boot.patch"
          patch -p1 < "$GITHUB_WORKSPACE/dias-laborales-v3/v310-notifications-calendar-support.patch"
          cat "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part0" "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part1" "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part2" > /tmp/v320.b64
          echo '48e4927602ea4f9f90c1f49f977d59606b800be03db4f5e416611eeea893acfb  /tmp/v320.b64' | sha256sum -c -
          base64 -d /tmp/v320.b64 | gzip -d > /tmp/v320.patch
          patch -p1 < /tmp/v320.patch
          patch -p1 < "$GITHUB_WORKSPACE/dias-laborales-v3/v320-javafix.patch"
          gzip -dc "$GITHUB_WORKSPACE/dias-laborales-v3/v321-exact-lyj.patch.gz" > /tmp/v321.patch
          set +e
          patch -p4 < /tmp/v321.patch
          PATCH_STATUS=$?
          set -e
          if [ "$PATCH_STATUS" -ne 0 ]; then
            REJECTS="$(find . -name '*.rej' -print)"
            test "$REJECTS" = './package-lock.json.rej'
            rm -f package-lock.json.rej
          fi
          test -z "$(find . -name '*.rej' -print)"
          set +e
          patch -p1 < "$GITHUB_WORKSPACE/dias-laborales-v3/v330-dedupe-support.patch"
          V330_STATUS=$?
          set -e
          if [ "$V330_STATUS" -ne 0 ]; then
            REJECTS="$(find . -name '*.rej' -print)"
            test "$REJECTS" = './package-lock.json.rej'
            rm -f package-lock.json.rej
          fi
          test -z "$(find . -name '*.rej' -print)"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          p.version = '3.3.0';
          if (p.packages && p.packages['']) p.packages[''].version = '3.3.0';
          fs.writeFileSync('package-lock.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          grep -q '"version": "3.3.0"' package.json
          grep -q 'versionCode 11' android/app/build.gradle
          grep -q 'android.permission.USE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'https://mpago.la/1oYkso5' src/main.js
          grep -q 'LyJ Desarrollos' index.html
          ! grep -q "scheduleRefresh('startup')" src/main.js
          grep -q 'KEY_FIRED' android/app/src/main/java/com/lyjdesarrollos/diaslaborales/WorkAlarmScheduler.java

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install and test
        working-directory: /tmp/dias-laborales
        run: |
          npm install
          npm test | tee /tmp/tests-v330.txt
          grep -q '# fail 0' /tmp/tests-v330.txt

      - name: Build web and sync
        working-directory: /tmp/dias-laborales
        run: |
          npm run build
          test -s dist/index.html
          grep -q 'LyJ Desarrollos' dist/index.html
          grep -q 'Colaborar' dist/index.html
          npx cap sync android

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/dias-laborales/android
          gradle assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/DiasLaborales-3.3.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/DiasLaborales-3.3.0.apk | tee /tmp/apksigner-v330.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/DiasLaborales-3.3.0.apk | tee /tmp/badging-v330.txt
          grep -q "versionCode='11'" /tmp/badging-v330.txt
          grep -q "versionName='3.3.0-debug'" /tmp/badging-v330.txt
          sha256sum /tmp/DiasLaborales-3.3.0.apk | tee /tmp/DiasLaborales-3.3.0.sha256
          cd /tmp/dias-laborales
          tar --exclude='./node_modules' --exclude='./android/.gradle' --exclude='./android/app/build' -czf /tmp/DiasLaborales-3.3.0-source.tar.gz .

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Verify background alarm after process death and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eux
            adb install /tmp/DiasLaborales-3.3.0.apk
            adb shell pm grant com.lyjdesarrollos.diaslaborales android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.lyjdesarrollos.diaslaborales -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell am start -n com.lyjdesarrollos.diaslaborales/.MainActivity --el native_alarm_test_ms 18000
            sleep 2
            adb shell input keyevent KEYCODE_HOME
            adb shell am kill com.lyjdesarrollos.diaslaborales
            adb shell dumpsys deviceidle force-idle || true
            sleep 24
            adb shell dumpsys notification --noredact > /tmp/native-notifications-v330-first.txt
            grep -q 'Prueba nativa en segundo plano' /tmp/native-notifications-v330-first.txt
            adb shell dumpsys deviceidle unforce || true
            adb shell monkey -p com.lyjdesarrollos.diaslaborales -c android.intent.category.LAUNCHER 1
            sleep 9
            adb shell dumpsys notification --noredact > /tmp/native-notifications-v330-after-reopen.txt
            adb logcat -d > /tmp/logcat-v330.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DiasLaborales-3.3.0-FINAL
          path: |
            /tmp/DiasLaborales-3.3.0.apk
            /tmp/DiasLaborales-3.3.0.sha256
            /tmp/DiasLaborales-3.3.0-source.tar.gz
            /tmp/apksigner-v330.txt
            /tmp/badging-v330.txt
            /tmp/tests-v330.txt
            /tmp/native-notifications-v330-first.txt
            /tmp/native-notifications-v330-after-reopen.txt
            /tmp/logcat-v330.txt
          if-no-files-found: warn
          retention-days: 7
