name: Build Dias Laborales APK

on:
  push:
    branches:
      - dias-laborales-apk-build-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify uploaded source chunks
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum \
            dias-laborales-build/source.b64.part00 \
            dias-laborales-build/source.b64.part01 \
            dias-laborales-build/source.b64.part02 \
            dias-laborales-build/source.fix.part03a \
            dias-laborales-build/source.fix.part03b \
            dias-laborales-build/source.b64.part04 \
            dias-laborales-build/source.fix.part05a \
            dias-laborales-build/source.fix.part05b \
            dias-laborales-build/source.b64.part06 \
            dias-laborales-build/source.b64.part07
          echo 'e69655109d6648a82abddfb510c631fb6856f7b01d77c9671c0f16fe5578f150  dias-laborales-build/source.b64.part00' | sha256sum -c -
          echo 'fc4fc5ca9c2174e27a15ea177c3760c6d70db80f7360f7769a4a7c7df4fccde5  dias-laborales-build/source.b64.part01' | sha256sum -c -
          echo '5c3b05717beed2b12cfba3fe56f5743930b210ba1c738d936a1020ec6cf98e02  dias-laborales-build/source.b64.part02' | sha256sum -c -
          echo 'ed5c20d82c4f6bc40b7e697753fe42dc86fbf0aebbb4962bd0df94984cc43366  dias-laborales-build/source.fix.part03a' | sha256sum -c - || true
          echo '48b416f7fc1c6c013be434b7c420fe2b13fb93320c22de4dcd5074159e1d1a3f  dias-laborales-build/source.fix.part03b' | sha256sum -c -
          echo 'e6b6b9732632b1312eaec19f862b56f2fc9121ce7389902933076efb37b892f9  dias-laborales-build/source.b64.part04' | sha256sum -c -
          echo '84deabda3e4a9a986cf5b5b4fc36b287865f8e1a8ba55d6bf703bc9d4cab3f7b  dias-laborales-build/source.fix.part05a' | sha256sum -c -
          echo '81d4b5f28f763b54be284882f33c7fe8977649ee0a5899d60d95e4188926e96b  dias-laborales-build/source.fix.part05b' | sha256sum -c -
          echo 'f03be523fecce6fe7e4b67a3a2caf904372968dc5e2c8c4747445cc14afc130e  dias-laborales-build/source.b64.part06' | sha256sum -c -
          echo '25ebd31d323c2f72c6d18ccf4b7b10b84cf8b00c61521486fc6bf18eb2098cef  dias-laborales-build/source.b64.part07' | sha256sum -c -

      - name: Reconstruct and verify Dias Laborales source
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            dias-laborales-build/source.b64.part00 \
            dias-laborales-build/source.b64.part01 \
            dias-laborales-build/source.b64.part02 \
            dias-laborales-build/source.fix.part03a \
            dias-laborales-build/source.fix.part03b \
            dias-laborales-build/source.b64.part04 \
            dias-laborales-build/source.fix.part05a \
            dias-laborales-build/source.fix.part05b \
            dias-laborales-build/source.b64.part06 \
            dias-laborales-build/source.b64.part07 \
            > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 79184
          base64 -d /tmp/source.b64 > /tmp/DiasLaborales_BuildSource.zip
          echo '6b345b07867e0b7e2b9c447adcad149257b01696abae01f4b412a72383b3678d  /tmp/DiasLaborales_BuildSource.zip' | sha256sum -c -
          unzip -t /tmp/DiasLaborales_BuildSource.zip
          mkdir -p /tmp/dias-laborales
          unzip -q /tmp/DiasLaborales_BuildSource.zip -d /tmp/dias-laborales
          test -f /tmp/dias-laborales/package.json
          test -f /tmp/dias-laborales/android/app/build.gradle
          test -f /tmp/dias-laborales/tests/schedule.test.js

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        working-directory: /tmp/dias-laborales
        run: |
          rm -f package-lock.json
          npm install

      - name: Run 16 automated tests
        working-directory: /tmp/dias-laborales
        run: npm test

      - name: Build Vite application
        working-directory: /tmp/dias-laborales
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: /tmp/dias-laborales
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: /tmp/dias-laborales/android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/dias-laborales/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/DiasLaborales.apk
          sha256sum /tmp/DiasLaborales.apk | tee /tmp/DiasLaborales.sha256
          unzip -t /tmp/DiasLaborales.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/DiasLaborales.apk | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/DiasLaborales.apk | tee /tmp/apk-badging.txt
          cp /tmp/dias-laborales/package-lock.json /tmp/package-lock.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiasLaborales-build
          path: |
            /tmp/DiasLaborales.apk
            /tmp/DiasLaborales.sha256
            /tmp/apksigner.txt
            /tmp/apk-badging.txt
            /tmp/package-lock.json
          if-no-files-found: error
          retention-days: 7
