name: Build and verify Dias Laborales 3.2.0

on:
  push:
    branches: [dias-laborales-v3-build-20260815]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified base and apply 3.2 patch
        shell: bash
        run: |
          set -euxo pipefail
          cat dias-laborales-v3/source.part00 dias-laborales-v3/source.part01 dias-laborales-v3/source.part02a dias-laborales-v3/source.part02b dias-laborales-v3/source.part03 dias-laborales-v3/source.part04 dias-laborales-v3/source.part05 dias-laborales-v3/source.part06 dias-laborales-v3/source.part07 dias-laborales-v3/source.part08 dias-laborales-v3/source.part09 > /tmp/pre.b64
          base64 -d /tmp/pre.b64 > /tmp/pre.bin
          cat dias-laborales-v3/c10b0.bin dias-laborales-v3/c10b1.bin dias-laborales-v3/c10b2.bin dias-laborales-v3/c10b3.bin dias-laborales-v3/c10b4.bin dias-laborales-v3/c10b5.bin dias-laborales-v3/c10b6.bin > /tmp/c10.bin
          base64 -d dias-laborales-v3/source.part11 > /tmp/post.bin
          cat /tmp/pre.bin /tmp/c10.bin /tmp/post.bin > /tmp/DiasLaborales_v3.tar.xz
          test "$(wc -c < /tmp/DiasLaborales_v3.tar.xz)" -eq 59488
          echo '1bef0afa3277f83b8fddedf5bf608d2455e55428cd32654159424039301dc57d  /tmp/DiasLaborales_v3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/dias-laborales
          tar -xJf /tmp/DiasLaborales_v3.tar.xz -C /tmp/dias-laborales
          cd /tmp/dias-laborales
          patch -p2 < "$GITHUB_WORKSPACE/dias-laborales-v3/v301-safe-boot.patch"
          patch -p1 < "$GITHUB_WORKSPACE/dias-laborales-v3/v310-notifications-calendar-support.patch"
          cat "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part0" "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part1" "$GITHUB_WORKSPACE/dias-laborales-v3/v320-background.part2" > /tmp/v320.b64
          test "$(wc -c < /tmp/v320.b64)" -eq 17076
          echo '48e4927602ea4f9f90c1f49f977d59606b800be03db4f5e416611eeea893acfb  /tmp/v320.b64' | sha256sum -c -
          base64 -d /tmp/v320.b64 | gzip -d > /tmp/v320.patch
          echo '337c45a325fafae16b48f4418b9ade5b619c61ba8e0325c4710e3bc7ebe98926  /tmp/v320.patch' | sha256sum -c -
          patch -p1 < /tmp/v320.patch
          grep -q '"version": "3.2.0"' package.json
          grep -q 'versionCode 9' android/app/build.gradle
          test -s android/app/src/main/java/com/lyjdesarrollos/diaslaborales/WorkAlarmReceiver.java
          test -s android/app/src/main/java/com/lyjdesarrollos/diaslaborales/WorkBootReceiver.java
          test -s android/app/src/main/java/com/lyjdesarrollos/diaslaborales/WorkAlarmPlugin.java
          grep -q 'Colaborar con Mercado Pago' index.html
          ! grep -q 'support-qr-wrap' index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install dependencies
        working-directory: /tmp/dias-laborales
        run: npm install

      - name: Run tests
        working-directory: /tmp/dias-laborales
        run: npm test

      - name: Build web app
        working-directory: /tmp/dias-laborales
        run: |
          npm run build
          test -s dist/index.html
          grep -q 'Colaborar con Mercado Pago' dist/index.html

      - name: Capacitor sync
        working-directory: /tmp/dias-laborales
        run: npx cap sync android

      - name: Build APK
        working-directory: /tmp/dias-laborales/android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/dias-laborales/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/DiasLaborales-3.2.0.apk
          unzip -t /tmp/DiasLaborales-3.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/DiasLaborales-3.2.0.apk | tee /tmp/apksigner-v320.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/DiasLaborales-3.2.0.apk | tee /tmp/apk-badging-v320.txt
          grep -q "versionCode='9'" /tmp/apk-badging-v320.txt
          grep -q "versionName='3.2.0-debug'" /tmp/apk-badging-v320.txt
          sha256sum /tmp/DiasLaborales-3.2.0.apk | tee /tmp/DiasLaborales-3.2.0.sha256
          cd /tmp/dias-laborales
          tar --exclude='./node_modules' --exclude='./android/.gradle' --exclude='./android/app/build' -czf /tmp/DiasLaborales-3.2.0-source.tar.gz .

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Native alarm survives killed app process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install /tmp/DiasLaborales-3.2.0.apk
            adb shell pm clear com.lyjdesarrollos.diaslaborales
            adb shell pm grant com.lyjdesarrollos.diaslaborales android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -n com.lyjdesarrollos.diaslaborales/.MainActivity --el native_alarm_test_ms 12000
            sleep 3
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am kill com.lyjdesarrollos.diaslaborales
            sleep 18
            adb shell dumpsys notification --noredact > /tmp/native-notifications-v320.txt
            grep -q 'Prueba nativa en segundo plano' /tmp/native-notifications-v320.txt
            grep -q 'AlarmManager entregó este aviso sin la app abierta' /tmp/native-notifications-v320.txt
            adb logcat -d > /tmp/android-logcat-v320.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL|Unable to start activity' /tmp/android-logcat-v320.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DiasLaborales-3.2.0-BACKGROUND-VERIFIED
          path: |
            /tmp/DiasLaborales-3.2.0.apk
            /tmp/DiasLaborales-3.2.0.sha256
            /tmp/DiasLaborales-3.2.0-source.tar.gz
            /tmp/apksigner-v320.txt
            /tmp/apk-badging-v320.txt
            /tmp/native-notifications-v320.txt
            /tmp/android-logcat-v320.txt
          if-no-files-found: warn
          retention-days: 7
