name: Build Dias Laborales v3 FINAL2

on:
  push:
    branches: [dias-laborales-v3-build-20260815]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euxo pipefail
          cat dias-laborales-v3/source.part00 dias-laborales-v3/source.part01 dias-laborales-v3/source.part02a dias-laborales-v3/source.part02b dias-laborales-v3/source.part03 dias-laborales-v3/source.part04 dias-laborales-v3/source.part05 dias-laborales-v3/source.part06 dias-laborales-v3/source.part07 dias-laborales-v3/source.part08 dias-laborales-v3/source.part09 > /tmp/pre.b64
          base64 -d /tmp/pre.b64 > /tmp/pre.bin
          cat dias-laborales-v3/c10b0.bin dias-laborales-v3/c10b1.bin dias-laborales-v3/c10b2.bin dias-laborales-v3/c10b3.bin dias-laborales-v3/c10b4.bin dias-laborales-v3/c10b5.bin dias-laborales-v3/c10b6.bin > /tmp/c10.bin
          base64 -d dias-laborales-v3/source.part11 > /tmp/post.bin
          cat /tmp/pre.bin /tmp/c10.bin /tmp/post.bin > /tmp/DiasLaborales_v3.tar.xz
          test "$(wc -c < /tmp/DiasLaborales_v3.tar.xz)" -eq 59488
          echo '1bef0afa3277f83b8fddedf5bf608d2455e55428cd32654159424039301dc57d  /tmp/DiasLaborales_v3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/dias-laborales
          tar -xJf /tmp/DiasLaborales_v3.tar.xz -C /tmp/dias-laborales
          test -f /tmp/dias-laborales/package.json
          test -f /tmp/dias-laborales/android/app/build.gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: npm install
        working-directory: /tmp/dias-laborales
        run: npm install

      - name: Run automated tests
        working-directory: /tmp/dias-laborales
        run: npm test

      - name: Build Vite
        working-directory: /tmp/dias-laborales
        run: npm run build

      - name: Capture UI screenshots
        continue-on-error: true
        working-directory: /tmp/dias-laborales
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/http.log 2>&1 &
          P=$!; sleep 1
          C="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,915 --virtual-time-budget=6000 --screenshot=/tmp/home.png 'http://127.0.0.1:4173/?demo=1&view=home' || true
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,1000 --virtual-time-budget=6000 --screenshot=/tmp/calendar.png 'http://127.0.0.1:4173/?demo=1&view=calendar' || true
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,1000 --virtual-time-budget=6000 --screenshot=/tmp/settings.png 'http://127.0.0.1:4173/?demo=1&view=settings' || true
          kill $P || true

      - name: Capacitor sync
        working-directory: /tmp/dias-laborales
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: /tmp/dias-laborales/android
        run: gradle assembleDebug --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/dias-laborales/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/DiasLaborales-3.0.0.apk
          unzip -t /tmp/DiasLaborales-3.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/DiasLaborales-3.0.0.apk | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/DiasLaborales-3.0.0.apk | tee /tmp/apk-badging.txt
          sha256sum /tmp/DiasLaborales-3.0.0.apk | tee /tmp/DiasLaborales-3.0.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DiasLaborales-3.0.0-FINAL2
          path: |
            /tmp/DiasLaborales-3.0.0.apk
            /tmp/DiasLaborales-3.0.0.sha256
            /tmp/apksigner.txt
            /tmp/apk-badging.txt
            /tmp/home.png
            /tmp/calendar.png
            /tmp/settings.png
          if-no-files-found: error
          retention-days: 7
