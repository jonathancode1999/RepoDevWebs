name: Build Dias Laborales v3 APK

on:
  push:
    branches: [dias-laborales-v3-build-20260815]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euxo pipefail
          echo 'c6b6cf3c85c0e287a24b56153de394ca596e0a1d3dd227f18489b85e7e355a4f  dias-laborales-v3/source.part00' | sha256sum -c -
          echo 'df336161523308715a6ce1344446b5d62ebad954cc319478251f66b47e9e15da  dias-laborales-v3/source.part01' | sha256sum -c -
          echo '744822ceed6e2beecee4fb749086e429320a5d053181a3f8d7a9b6eabe4768c7  dias-laborales-v3/source.part02a' | sha256sum -c -
          echo '8393962693434d8b7de93d303d6fc05a16fb5d39183e37546afb8aef949a44ec  dias-laborales-v3/source.part02b' | sha256sum -c -
          echo 'c6beab0dd38af8f4e7f7ddbea02b1e9779d449824a5d37136425bf563d509410  dias-laborales-v3/source.part03' | sha256sum -c -
          echo '4fc878cd776001c1f1654afbbfce2ead48b4d599699328ce27ae10d20551dd17  dias-laborales-v3/source.part04' | sha256sum -c -
          echo '2a1ba2b33d6e66a20f3b216410f5d5003d05fe2bae8dfcc683109aeebbd8ccc8  dias-laborales-v3/source.part05' | sha256sum -c -
          echo '8c0e56211049865f8e7470a286579f82d485c46e595e5a2bbdbcb5a255579746  dias-laborales-v3/source.part06' | sha256sum -c -
          echo 'ebef5a4ed5650162f35154c31cd83752ea134803b598d8299b5100d74965ed23  dias-laborales-v3/source.part07' | sha256sum -c -
          echo '273c87feee8c4c4a9ec7733d792b5e2dfd3aaad2bc732222c020e3734bad28ac  dias-laborales-v3/source.part08' | sha256sum -c -
          echo 'd9756b43870235afdddf075cb6b5ff7ff20bfec84f0fbb7cde83e42c68efafeb  dias-laborales-v3/source.part09' | sha256sum -c -
          echo '04ca29a62020401286a8596e2e0dc5dc0a27addc89828f055d2d080a5cf56cff  dias-laborales-v3/c10b0.bin' | sha256sum -c -
          echo '5160322f7b3cb1a66e8bfee2ad62a15db26acbf69b4b7d554c58ae3b87d34e1b  dias-laborales-v3/c10b1.bin' | sha256sum -c -
          echo 'c0f3e7ada5ec18922f73931bb2471053c6ffd6527e0841d2898f6c08cc13e1c4  dias-laborales-v3/c10b2.bin' | sha256sum -c -
          echo '6241eca3557005d4fb107beb791fba25e708d06f8b24ece10af4c744274deb87  dias-laborales-v3/c10b3.bin' | sha256sum -c -
          echo '41b7ea2c7c6a0315628a9e6fee12239999d275e2814cd26ae42b072d4c2a5371  dias-laborales-v3/c10b4.bin' | sha256sum -c -
          echo 'f7f6cc249ac3af8f31af4e681923d58ee5c7594433981ad5afb828fb262c3aa1  dias-laborales-v3/c10b5.bin' | sha256sum -c -
          echo '3a486132b9842845cf23697e27652513144e0a02f8e677cc577b6fbb366be808  dias-laborales-v3/c10b6.bin' | sha256sum -c -
          echo '3872ea5a455797442945091e23bb9ca430f0982b089285105058b3baa767c30c  dias-laborales-v3/source.part11' | sha256sum -c -

          cat dias-laborales-v3/source.part00 dias-laborales-v3/source.part01 dias-laborales-v3/source.part02a dias-laborales-v3/source.part02b dias-laborales-v3/source.part03 dias-laborales-v3/source.part04 dias-laborales-v3/source.part05 dias-laborales-v3/source.part06 dias-laborales-v3/source.part07 dias-laborales-v3/source.part08 dias-laborales-v3/source.part09 > /tmp/pre.b64
          base64 -d /tmp/pre.b64 > /tmp/pre.bin
          cat dias-laborales-v3/c10b0.bin dias-laborales-v3/c10b1.bin dias-laborales-v3/c10b2.bin dias-laborales-v3/c10b3.bin dias-laborales-v3/c10b4.bin dias-laborales-v3/c10b5.bin dias-laborales-v3/c10b6.bin > /tmp/c10.bin
          test "$(wc -c < /tmp/c10.bin)" -eq 5250
          echo '31cd9086df53538d8456aaf9d6965744321834e41595a9be7c3fd1f996da9ded  /tmp/c10.bin' | sha256sum -c -
          base64 -d dias-laborales-v3/source.part11 > /tmp/post.bin
          cat /tmp/pre.bin /tmp/c10.bin /tmp/post.bin > /tmp/DiasLaborales_v3.tar.xz
          test "$(wc -c < /tmp/DiasLaborales_v3.tar.xz)" -eq 59488
          echo '1bef0afa3277f83b8fddedf5bf608d2455e55428cd32654159424039301dc57d  /tmp/DiasLaborales_v3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/dias-laborales
          tar -xJf /tmp/DiasLaborales_v3.tar.xz -C /tmp/dias-laborales
          test -f /tmp/dias-laborales/src/core/events.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build web
        working-directory: /tmp/dias-laborales
        shell: bash
        run: |
          set -euxo pipefail
          npm install
          npm test | tee /tmp/tests.txt
          grep -q '# tests 23' /tmp/tests.txt
          grep -q '# pass 23' /tmp/tests.txt
          grep -q '# fail 0' /tmp/tests.txt
          npm run build
          grep -q 'src="./assets/' dist/index.html
          grep -R -q 'Próximo aviso' dist
          grep -R -q 'Nueva anotación' dist
          grep -R -q 'Probar notificación' dist

      - name: Visual smoke test
        working-directory: /tmp/dias-laborales
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/http.log 2>&1 &
          P=$!; trap 'kill $P || true' EXIT; sleep 1
          C="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$C" --headless --no-sandbox --disable-gpu --window-size=412,915 --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:4173/?demo=1&view=home' > /tmp/home-dom.html
          grep -q 'TRABAJ' /tmp/home-dom.html
          grep -q 'Próximo aviso' /tmp/home-dom.html
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,915 --virtual-time-budget=5000 --screenshot=/tmp/home.png 'http://127.0.0.1:4173/?demo=1&view=home'
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,1000 --virtual-time-budget=5000 --screenshot=/tmp/calendar.png 'http://127.0.0.1:4173/?demo=1&view=calendar'
          "$C" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=412,1000 --virtual-time-budget=5000 --screenshot=/tmp/settings.png 'http://127.0.0.1:4173/?demo=1&view=settings'

      - name: Sync Capacitor
        working-directory: /tmp/dias-laborales
        run: npx cap sync android
      - name: Assemble APK
        working-directory: /tmp/dias-laborales/android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          A=/tmp/dias-laborales/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$A" /tmp/DiasLaborales-3.0.0.apk
          unzip -t /tmp/DiasLaborales-3.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/DiasLaborales-3.0.0.apk | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/DiasLaborales-3.0.0.apk | tee /tmp/apk-badging.txt
          grep -q "versionCode='6'" /tmp/apk-badging.txt
          grep -q "versionName='3.0.0-debug'" /tmp/apk-badging.txt
          sha256sum /tmp/DiasLaborales-3.0.0.apk | tee /tmp/DiasLaborales-3.0.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DiasLaborales-3.0.0
          path: |
            /tmp/DiasLaborales-3.0.0.apk
            /tmp/DiasLaborales-3.0.0.sha256
            /tmp/apksigner.txt
            /tmp/apk-badging.txt
            /tmp/home.png
            /tmp/calendar.png
            /tmp/settings.png
          if-no-files-found: error
          retention-days: 7
